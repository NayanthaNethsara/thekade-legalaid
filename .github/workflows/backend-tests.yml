name: Backend Tests

on:
  push:
    branches: [main, dev, feature/*]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test environment file
        working-directory: ./backend
        run: |
          cp .env.example .env
          echo "WHATSAPP_ACCESS_TOKEN=test_token" >> .env
          echo "WHATSAPP_PHONE_NUMBER_ID=test_phone_id" >> .env
          echo "WHATSAPP_VERIFY_TOKEN=test_verify_token" >> .env

      - name: Run unit tests
        working-directory: ./backend
        run: |
          pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Run integration tests
        working-directory: ./backend
        run: |
          pytest tests/integration/ -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          directory: ./backend/
          flags: backend
          name: codecov-backend
          fail_ci_if_error: false

      - name: Generate test report
        working-directory: ./backend
        if: always()
        run: |
          pytest tests/ --junitxml=test-results.xml --cov=app --cov-report=html

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            backend/test-results.xml
            backend/htmlcov/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy

      - name: Run black
        working-directory: ./backend
        run: black --check --diff app/ tests/

      - name: Run isort
        working-directory: ./backend
        run: isort --check-only --diff app/ tests/

      - name: Run flake8
        working-directory: ./backend
        run: flake8 app/ tests/

      - name: Run mypy
        working-directory: ./backend
        run: mypy app/ --ignore-missing-imports
