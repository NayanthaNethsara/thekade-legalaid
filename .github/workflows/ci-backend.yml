name: CI Backend

# Quality gate for backend-service on every PR into dev.
# Lint, typecheck, and smoke-build the image. No deployment happens here.
on:
  pull_request:
    branches: [main]
    paths:
      - "backend-service/**"
      - ".github/workflows/ci-backend.yml"

# Cancel superseded runs on the same PR to save minutes.
concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-service
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.x"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app

      - name: Docker build (smoke)
        run: docker build -t kakille-backend:ci .
