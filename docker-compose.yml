services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: legalaid
      POSTGRES_USER: legalaid
      POSTGRES_PASSWORD: legalaid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalaid"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Lightweight web viewer for Postgres (auto-connects, no login). http://localhost:8081
  pgweb:
    image: sosedoff/pgweb:latest
    environment:
      PGWEB_DATABASE_URL: postgres://legalaid:legalaid@postgres:5432/legalaid?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  redis:
    image: redis/redis-stack-server:7.4.0-v6
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  whatsapp-gateway:
    build:
      context: ./whatsapp-gateway
    env_file:
      - ./whatsapp-gateway/.env
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats
    ports:
      - "3000:3000"

  admin-service:
    build:
      context: ./admin-service
    env_file:
      - ./admin-service/.env
    environment:
      DATABASE_URL: postgresql://legalaid:legalaid@postgres:5432/legalaid
    volumes:
      - ./admin-service:/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"

  # kakilleAI LLM & agent orchestration service (Go).
  core-service:
    build:
      context: ./core-service
    environment:
      ENV: production
      PORT: "8002"
      NATS_URL: nats://nats:4222
      DATABASE_URL: postgres://legalaid:legalaid@postgres:5432/legalaid
      NATS_SUBJECT_INCOMING_TEXT: whatsapp.incoming.text
      NATS_SUBJECT_OUTGOING_TEXT: whatsapp.outgoing.text
    depends_on:
      nats:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "8002:8002"

volumes:
  nats_data:
  postgres_data:
  redis_data:
