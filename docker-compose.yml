services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: legalaid
      POSTGRES_USER: legalaid
      POSTGRES_PASSWORD: legalaid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalaid"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Lightweight web viewer for Postgres (auto-connects, no login). http://localhost:8081
  pgweb:
    image: sosedoff/pgweb:latest
    environment:
      PGWEB_DATABASE_URL: postgres://legalaid:legalaid@postgres:5432/legalaid?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  redis:
    image: redis/redis-stack-server:7.4.0-v6
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  whatsapp-gateway:
    build:
      context: ./whatsapp-gateway
    env_file:
      - ./whatsapp-gateway/.env
    environment:
      NATS_URL: nats://nats:4222
      NODE_ENV: production
    depends_on:
      - nats
    ports:
      - "3000:3000"

  # kakilleAI backend: RAG builder, auth/OTP/identity, NATS WhatsApp I/O, and the
  # LangGraph agent orchestrator. Single Python service (formerly admin-service).
  backend-service:
    build:
      context: ./backend-service
    env_file:
      - ./backend-service/.env
    environment:
      DATABASE_URL: postgresql://legalaid:legalaid@postgres:5432/legalaid
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      NATS_SUBJECT_INCOMING_TEXT: whatsapp.incoming.text
      NATS_SUBJECT_OUTGOING: whatsapp.outgoing
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:-98b87a4463adf02ab47898a238da88c88848f3ad144f3d9ad2b0a6fc0cc6cd0b}
    volumes:
      - ./backend-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    ports:
      - "8001:8001"

  # ── Observability stack ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - whatsapp-gateway
      - backend-service

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/kakilleai-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.1.1
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.15.0
    command:
      ["-varz", "-jsz=all", "-connz", "-routez", "-subz", "http://nats:8222"]
    depends_on:
      - nats

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: "postgresql://legalaid:legalaid@postgres:5432/legalaid?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

volumes:
  nats_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
